[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrm-ch02"
version = "0.1.0"
description = "Companion code for Chapter 2 of Build a Large Robot Model (From Scratch)"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.1,<3.0",
    "numpy>=1.24,<3.0",
    "gymnasium>=0.29,<2.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
# Simulator. ManiSkill3 (Apache 2.0, SAPIEN-based) ships SO-100 as a
# first-class robot and SO100GraspCube as a sim2real digital twin. See
# docs/design.md §5 for the rationale and the lerobot-sim2real notes.
# Colab readers must run the 7-cell Vulkan setup documented in the
# README before this extra is usable.
sim = [
    # Pinned to our ManiSkill fork, which adds the SO-101 arm and
    # PickCubeSO101-v1. Upstream has no SO-101 (PR #1171 stalled), so the
    # fork is the only way to run the arm this chapter's hardware target
    # actually uses. Pinned by commit, not branch, so installs stay
    # reproducible. Revert to "mani-skill==3.0.1" once the PR merges.
    "mani-skill @ git+https://github.com/Large-Robotics-Models-From-Scratch/ManiSkill.git@685264f2c97d46d9bbed9ff4dca46fb9b1649019",
]
# Dataset stack. Targets the lerobot 0.5.1 API for SO-101 datasets.
data = [
    "lerobot==0.5.1",
]
# Vision-language-action policies. `lerobot[smolvla]` pulls transformers
# and the SmolVLM backbone, which the [data] extra alone does not. Needed
# only to run ch02.vla_rollout, not for the dataset or pipeline listings.
vla = [
    "lerobot[smolvla]==0.5.1",
]
# Developer tooling.
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff",
    "jupyter",
    "nbconvert",
    "nbstripout",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 76
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring ManiSkill / SAPIEN / Vulkan (deselect with -m 'not integration')",
]
